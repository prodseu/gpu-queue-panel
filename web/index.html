<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPU Queue Panel</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body><main><header><div><div class="eyebrow">GPU QUEUE / PERSONAL</div><h1>我的任务队列</h1><p>本机查看 · SSH 连接 · 每 3 秒刷新</p></div><div id="connection">连接中</div></header><div id="notice" role="status"></div><p class="device-hint">自动识别服务器显卡 · 点击显卡查看该卡的个人队列</p><section class="gpus" id="gpus" aria-label="服务器显卡"></section><section class="queue-section"><nav class="queue-views" aria-label="队列视图"><button type="button" id="all-queues" aria-pressed="true">总队列</button><span id="queue-scope">全部显卡与CPU任务</span></nav><div class="section-heading"><h2><span id="queue-title">总队列</span> <span id="count"></span></h2><span id="sampled"></span></div><p class="hint" id="queue-hint"></p><div id="tasks"></div></section><footer id="controller"></footer></main><dialog id="auth-dialog"><form id="auth-form"><h2>连接本机界面</h2><label>本机访问令牌<input type="password" id="auth-token" required autocomplete="off"></label><button>连接</button></form></dialog></body></html>
