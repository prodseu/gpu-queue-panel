<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPU Queue Panel</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body><main><header><div><div class="eyebrow">GPU QUEUE / PERSONAL</div><h1>我的任务队列</h1><p>本机查看 · SSH 连接 · 每 3 秒刷新</p></div><div id="connection">连接中</div></header><div id="notice" role="status"></div><p class="device-hint">自动识别服务器显卡 · 点击显卡查看该卡的个人队列</p><section class="gpus" id="gpus" aria-label="服务器显卡"></section><section class="scheduling-panel"><div class="section-heading"><h2>并发与资源保护</h2><span id="scheduler-usage"></span></div><form id="scheduling-form"><div class="settings-grid"><label>队列窗口（全局并发上限）<input name="window" type="number" min="-1" max="8" required></label><label>保留空闲显存（GiB）<input name="reserve_mib" type="number" min="-1" max="1024" required></label><label>显存占用上限（%）<input name="memory_limit_percent" type="number" min="-1" max="95" required></label><label>单任务预计峰值（GiB）<input name="default_peak_mib" type="number" min="-1" max="1024" required></label><label>启动计算利用率阈值（%）<input name="utilization_limit" type="number" min="-1" max="95" required></label><label>连续低于阈值（秒）<input name="stable_seconds" type="number" min="-1" max="300" required></label><label>启动间隔（秒）<input name="launch_interval_seconds" type="number" min="-1" max="600" required></label></div><button type="submit">保存设置</button><button type="button" id="settings-reset">恢复已保存值</button></form><p class="hint">每个设置填 -1 表示不限制；计算利用率默认不限制。缩小窗口不会中断运行项。保护只限制新启动，不会限制运行任务的GPU算力或保证不OOM；峰值预算需覆盖训练和验证最大显存。任务可单独登记 peak_memory_mib。只按队首领取。</p><p id="admission-reason" role="status"></p></section><section class="queue-section"><nav class="queue-views" aria-label="队列视图"><button type="button" id="all-queues" aria-pressed="true">总队列</button><span id="queue-scope">全部显卡与CPU任务</span></nav><div class="section-heading"><h2><span id="queue-title">总队列</span> <span id="count"></span></h2><span id="sampled"></span></div><p class="hint" id="queue-hint"></p><div id="tasks"></div></section><footer id="controller"></footer></main><dialog id="auth-dialog"><form id="auth-form"><h2>连接本机界面</h2><label>本机访问令牌<input type="password" id="auth-token" required autocomplete="off"></label><button>连接</button></form></dialog></body></html>
